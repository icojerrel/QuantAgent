<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Dashboard - QuantAgent</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 2rem;
            color: #333;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .metric-card .label {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .metric-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
        }

        .metric-card .value.positive {
            color: #22c55e;
        }

        .metric-card .value.negative {
            color: #ef4444;
        }

        .metric-card .change {
            font-size: 0.85rem;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .metric-card .change.up {
            color: #22c55e;
        }

        .metric-card .change.down {
            color: #ef4444;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .chart-container h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.3rem;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
        }

        .chart-wrapper.large {
            height: 400px;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge.long {
            background: #dcfce7;
            color: #166534;
        }

        .badge.short {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge.hold {
            background: #e5e7eb;
            color: #374151;
        }

        .badge.open {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge.closed {
            background: #f3f4f6;
            color: #6b7280;
        }

        .pnl-positive {
            color: #22c55e;
            font-weight: 600;
        }

        .pnl-negative {
            color: #ef4444;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: #666;
            font-weight: 500;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .refresh-time {
            font-size: 0.8rem;
            color: #999;
            text-align: right;
            margin-top: 10px;
        }

        .icon {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📊 Performance Dashboard</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="refreshDashboard()">🔄 Refresh</button>
                <a href="/enhanced-settings" class="btn btn-secondary">⚙️ Settings</a>
                <a href="/" class="btn btn-primary">🔙 Back to Analysis</a>
            </div>
        </div>

        <!-- Key Metrics Cards -->
        <div class="metrics-grid" id="metrics-cards">
            <div class="loading">Loading metrics</div>
        </div>

        <!-- Equity Curve Chart -->
        <div class="chart-container">
            <h2>📈 Equity Curve</h2>
            <div class="chart-wrapper large">
                <canvas id="equityChart"></canvas>
            </div>
            <div class="refresh-time" id="equity-refresh-time"></div>
        </div>

        <!-- Daily P&L and Win Rate Charts -->
        <div class="grid-2col">
            <div class="chart-container">
                <h2>💰 Daily P&L (Last 30 Days)</h2>
                <div class="chart-wrapper">
                    <canvas id="dailyPnlChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <h2>🎯 Performance by Symbol</h2>
                <div class="chart-wrapper">
                    <canvas id="symbolStatsChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Open Positions -->
        <div class="table-container" id="open-positions-section">
            <h2>📍 Open Positions</h2>
            <div id="open-positions-content">
                <div class="loading">Loading open positions</div>
            </div>
        </div>

        <!-- Trade History -->
        <div class="table-container">
            <h2>📜 Trade History</h2>

            <!-- Filters -->
            <div class="filters">
                <div class="filter-group">
                    <label>Status</label>
                    <select id="filter-status" onchange="loadTradeHistory()">
                        <option value="all">All Trades</option>
                        <option value="closed" selected>Closed Only</option>
                        <option value="open">Open Only</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Side</label>
                    <select id="filter-side" onchange="loadTradeHistory()">
                        <option value="">All Sides</option>
                        <option value="LONG">Long Only</option>
                        <option value="SHORT">Short Only</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Limit</label>
                    <select id="filter-limit" onchange="loadTradeHistory()">
                        <option value="25">25 trades</option>
                        <option value="50" selected>50 trades</option>
                        <option value="100">100 trades</option>
                        <option value="200">200 trades</option>
                    </select>
                </div>
            </div>

            <div id="trade-history-content">
                <div class="loading">Loading trade history</div>
            </div>
            <div class="refresh-time" id="trades-refresh-time"></div>
        </div>
    </div>

    <script>
        // Global chart instances
        let equityChart = null;
        let dailyPnlChart = null;
        let symbolStatsChart = null;

        // Load dashboard on page load
        window.addEventListener('DOMContentLoaded', () => {
            refreshDashboard();
        });

        async function refreshDashboard() {
            await Promise.all([
                loadMetricsCards(),
                loadEquityCurve(),
                loadDailyPnL(),
                loadSymbolStats(),
                loadOpenPositions(),
                loadTradeHistory()
            ]);
        }

        async function loadMetricsCards() {
            try {
                const response = await fetch('/api/dashboard/summary');
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error);
                }

                const metrics = data.data;

                const html = `
                    <div class="metric-card">
                        <div class="icon">💰</div>
                        <div class="label">Current Equity</div>
                        <div class="value positive">$${metrics.current_equity.toFixed(2)}</div>
                    </div>

                    <div class="metric-card">
                        <div class="icon">📈</div>
                        <div class="label">Total Return</div>
                        <div class="value ${metrics.total_return_pct >= 0 ? 'positive' : 'negative'}">
                            ${metrics.total_return_pct >= 0 ? '+' : ''}${metrics.total_return_pct.toFixed(2)}%
                        </div>
                    </div>

                    <div class="metric-card">
                        <div class="icon">🎯</div>
                        <div class="label">Win Rate</div>
                        <div class="value">${metrics.win_rate.toFixed(1)}%</div>
                        <div class="change">
                            ${metrics.total_trades} total trades
                        </div>
                    </div>

                    <div class="metric-card">
                        <div class="icon">⚡</div>
                        <div class="label">Sharpe Ratio</div>
                        <div class="value">${metrics.sharpe_ratio.toFixed(2)}</div>
                    </div>

                    <div class="metric-card">
                        <div class="icon">📉</div>
                        <div class="label">Max Drawdown</div>
                        <div class="value negative">${metrics.max_drawdown_pct.toFixed(2)}%</div>
                    </div>

                    <div class="metric-card">
                        <div class="icon">💪</div>
                        <div class="label">Profit Factor</div>
                        <div class="value ${metrics.profit_factor >= 1.5 ? 'positive' : ''}">${metrics.profit_factor.toFixed(2)}</div>
                    </div>
                `;

                document.getElementById('metrics-cards').innerHTML = html;

            } catch (error) {
                document.getElementById('metrics-cards').innerHTML = `
                    <div class="error-message">Error loading metrics: ${error.message}</div>
                `;
            }
        }

        async function loadEquityCurve() {
            try {
                const response = await fetch('/api/dashboard/equity-curve');
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error);
                }

                const equityCurve = data.data;

                if (equityCurve.length === 0) {
                    return;
                }

                const labels = equityCurve.map(point => {
                    const date = new Date(point.timestamp);
                    return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                });

                const values = equityCurve.map(point => point.equity);

                const ctx = document.getElementById('equityChart').getContext('2d');

                if (equityChart) {
                    equityChart.destroy();
                }

                equityChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Equity',
                            data: values,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 2,
                            pointHoverRadius: 5
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return '$' + context.parsed.y.toFixed(2);
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: false,
                                ticks: {
                                    callback: function(value) {
                                        return '$' + value.toFixed(0);
                                    }
                                }
                            }
                        }
                    }
                });

                document.getElementById('equity-refresh-time').textContent =
                    `Last updated: ${new Date().toLocaleTimeString()}`;

            } catch (error) {
                console.error('Error loading equity curve:', error);
            }
        }

        async function loadDailyPnL() {
            try {
                const response = await fetch('/api/dashboard/daily-pnl?days=30');
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error);
                }

                const dailyData = data.data;

                const labels = dailyData.map(d => d.date);
                const values = dailyData.map(d => d.pnl);

                const colors = values.map(v => v >= 0 ? 'rgba(34, 197, 94, 0.7)' : 'rgba(239, 68, 68, 0.7)');

                const ctx = document.getElementById('dailyPnlChart').getContext('2d');

                if (dailyPnlChart) {
                    dailyPnlChart.destroy();
                }

                dailyPnlChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Daily P&L',
                            data: values,
                            backgroundColor: colors,
                            borderColor: colors.map(c => c.replace('0.7', '1')),
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return '$' + context.parsed.y.toFixed(2);
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                ticks: {
                                    callback: function(value) {
                                        return '$' + value.toFixed(0);
                                    }
                                }
                            }
                        }
                    }
                });

            } catch (error) {
                console.error('Error loading daily P&L:', error);
            }
        }

        async function loadSymbolStats() {
            try {
                const response = await fetch('/api/dashboard/stats-by-symbol');
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error);
                }

                const stats = data.data;
                const symbols = Object.keys(stats);
                const winRates = symbols.map(s => stats[s].win_rate);

                const ctx = document.getElementById('symbolStatsChart').getContext('2d');

                if (symbolStatsChart) {
                    symbolStatsChart.destroy();
                }

                symbolStatsChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: symbols,
                        datasets: [{
                            label: 'Win Rate (%)',
                            data: winRates,
                            backgroundColor: 'rgba(102, 126, 234, 0.7)',
                            borderColor: 'rgba(102, 126, 234, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 100,
                                ticks: {
                                    callback: function(value) {
                                        return value + '%';
                                    }
                                }
                            }
                        }
                    }
                });

            } catch (error) {
                console.error('Error loading symbol stats:', error);
            }
        }

        async function loadOpenPositions() {
            try {
                const response = await fetch('/api/dashboard/open-positions');
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error);
                }

                const positions = data.data.positions;

                if (positions.length === 0) {
                    document.getElementById('open-positions-content').innerHTML = `
                        <p style="text-align: center; color: #999; padding: 20px;">No open positions</p>
                    `;
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th>Entry Price</th>
                                <th>Current Price</th>
                                <th>Position Size</th>
                                <th>Unrealized P&L</th>
                                <th>Stop Loss</th>
                                <th>Take Profit</th>
                                <th>Entry Time</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                for (const pos of positions) {
                    const pnlClass = pos.unrealized_pnl >= 0 ? 'pnl-positive' : 'pnl-negative';
                    const entryTime = new Date(pos.entry_time).toLocaleString();

                    html += `
                        <tr>
                            <td><strong>${pos.symbol}</strong></td>
                            <td><span class="badge ${pos.side.toLowerCase()}">${pos.side}</span></td>
                            <td>$${pos.entry_price.toFixed(2)}</td>
                            <td>$${(pos.current_price || pos.entry_price).toFixed(2)}</td>
                            <td>${pos.position_size.toFixed(4)}</td>
                            <td class="${pnlClass}">$${(pos.unrealized_pnl || 0).toFixed(2)}</td>
                            <td>$${(pos.stop_loss || 0).toFixed(2)}</td>
                            <td>$${(pos.take_profit || 0).toFixed(2)}</td>
                            <td>${entryTime}</td>
                        </tr>
                    `;
                }

                html += `
                        </tbody>
                    </table>
                    <p style="margin-top: 15px; font-weight: 600;">
                        Total Unrealized P&L:
                        <span class="${data.data.total_unrealized_pnl >= 0 ? 'pnl-positive' : 'pnl-negative'}">
                            $${data.data.total_unrealized_pnl.toFixed(2)}
                        </span>
                    </p>
                `;

                document.getElementById('open-positions-content').innerHTML = html;

            } catch (error) {
                document.getElementById('open-positions-content').innerHTML = `
                    <div class="error-message">Error loading open positions: ${error.message}</div>
                `;
            }
        }

        async function loadTradeHistory() {
            try {
                const status = document.getElementById('filter-status').value;
                const side = document.getElementById('filter-side').value;
                const limit = document.getElementById('filter-limit').value;

                let url = `/api/dashboard/trades?limit=${limit}&status=${status}`;
                if (side) {
                    url += `&side=${side}`;
                }

                const response = await fetch(url);
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error);
                }

                const trades = data.data.trades;

                if (trades.length === 0) {
                    document.getElementById('trade-history-content').innerHTML = `
                        <p style="text-align: center; color: #999; padding: 20px;">No trades found</p>
                    `;
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th>Entry</th>
                                <th>Exit</th>
                                <th>Size</th>
                                <th>P&L</th>
                                <th>P&L %</th>
                                <th>Status</th>
                                <th>Entry Time</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                for (const trade of trades) {
                    const pnlClass = trade.pnl >= 0 ? 'pnl-positive' : 'pnl-negative';
                    const pnlPctClass = trade.pnl_pct >= 0 ? 'pnl-positive' : 'pnl-negative';
                    const entryTime = new Date(trade.entry_time).toLocaleString();

                    html += `
                        <tr onclick="window.location.href='/trade/${trade.id}'" style="cursor: pointer;">
                            <td>${trade.id}</td>
                            <td><strong>${trade.symbol}</strong></td>
                            <td><span class="badge ${trade.side.toLowerCase()}">${trade.side}</span></td>
                            <td>$${trade.entry_price.toFixed(2)}</td>
                            <td>${trade.exit_price ? '$' + trade.exit_price.toFixed(2) : '-'}</td>
                            <td>${trade.position_size.toFixed(4)}</td>
                            <td class="${pnlClass}">${trade.pnl ? '$' + trade.pnl.toFixed(2) : '-'}</td>
                            <td class="${pnlPctClass}">${trade.pnl_pct ? trade.pnl_pct.toFixed(2) + '%' : '-'}</td>
                            <td><span class="badge ${trade.status}">${trade.status}</span></td>
                            <td>${entryTime}</td>
                        </tr>
                    `;
                }

                html += `
                        </tbody>
                    </table>
                `;

                document.getElementById('trade-history-content').innerHTML = html;
                document.getElementById('trades-refresh-time').textContent =
                    `Last updated: ${new Date().toLocaleTimeString()}`;

            } catch (error) {
                document.getElementById('trade-history-content').innerHTML = `
                    <div class="error-message">Error loading trade history: ${error.message}</div>
                `;
            }
        }

        // Auto-refresh every 30 seconds
        setInterval(refreshDashboard, 30000);
    </script>
</body>
</html>
